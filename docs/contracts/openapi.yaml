components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: tropio_session
      description: HttpOnly, SameSite=Lax; в production также Secure.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Токен из csrf_token собственного профиля для изменения данных и сессии.
    registration:
      type: apiKey
      in: cookie
      name: tropio_registration
      description: HttpOnly cookie браузера, в котором началась регистрация.
  parameters:
    IdentityOrigin:
      name: Origin
      in: header
      required: true
      schema: {type: string, format: uri}
      description: Должен совпадать с настроенным origin приложения.
    TravelDayId:
      name: dayId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MyTripsCursor:
      name: cursor
      in: query
      description: UUID последней поездки из предыдущей страницы.
      schema:
        $ref: '#/components/schemas/Uuid'
    MyTripsLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RouteId:
      name: routeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PoiId:
      name: poiId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Новый UUID на новую команду. Повтор использует тот же ключ и те же входные параметры.
      schema:
        $ref: '#/components/schemas/Uuid'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    Bbox:
      name: bbox
      in: query
      style: form
      explode: false
      description: west,south,east,north в WGS 84. Пересечение антимеридиана в этом контракте не поддерживается.
      schema:
        type: array
        minItems: 4
        maxItems: 4
        items:
          type: number
    Cursor:
      name: cursor
      in: query
      description: Непрозрачный токен BFF для тех же фильтров и контекста доступа.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
  responses:
    GeoInvalidRequest:
      description: Недопустимое тело, заголовок, UUID или параметры запроса.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 400}
                  code: {const: INVALID_REQUEST}
    GeoSessionRequired:
      description: Требуется действующая сессия.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 401}
                  code: {const: SESSION_REQUIRED}
    GeoCsrfRejected:
      description: Отклонён Origin или токен защиты запроса.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 403}
                  code: {const: CSRF_REJECTED}
    GeoNotFound:
      description: Объект отсутствует или недоступен.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 404}
                  code: {const: NOT_FOUND}
    GeoRouteConflict:
      description: Ключ повтора занят либо ревизия маршрута изменилась.
      content:
        application/problem+json:
          schema:
            oneOf:
              - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status: {const: 409}
                      code: {const: IDEMPOTENCY_KEY_REUSED}
              - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status: {const: 409}
                      code: {const: ROUTE_REVISION_CONFLICT}
    GeoPoiConflict:
      description: Ключ повтора занят либо ревизия POI изменилась.
      content:
        application/problem+json:
          schema:
            oneOf:
              - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status: {const: 409}
                      code: {const: IDEMPOTENCY_KEY_REUSED}
              - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status: {const: 409}
                      code: {const: POI_REVISION_CONFLICT}
    GeoKeyReused:
      description: Ключ использован с другим содержимым либо сохранённый результат недоступен.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 409}
                  code: {const: IDEMPOTENCY_KEY_REUSED}
    GeoRouteRejected:
      description: Инварианты маршрута, дорожная привязка или текущий доступ к зависимости отклонили сохранение.
      content:
        application/problem+json:
          schema:
            oneOf:
              - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status: {const: 422}
                      code: {const: INVALID_ROUTE_TOPOLOGY}
              - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status: {const: 422}
                      code: {const: ROUTE_BUILD_UNAVAILABLE}
              - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status: {const: 422}
                      code: {const: SNAP_CONFIRMATION_REQUIRED}
              - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status: {const: 422}
                      code: {const: ROUTE_GEOMETRY_RESTRICTED}
              - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status: {const: 422}
                      code: {const: POI_SCOPE_RESTRICTED}
    GeoSplitRejected:
      description: Точка деления непригодна либо геометрия ограничена.
      content:
        application/problem+json:
          schema:
            oneOf:
              - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status: {const: 422}
                      code: {const: INVALID_SPLIT_POSITION}
              - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status: {const: 422}
                      code: {const: ROUTE_GEOMETRY_RESTRICTED}
    GeoGeometryRestricted:
      description: Историческая геометрия или её зависимости недоступны.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 422}
                  code: {const: ROUTE_GEOMETRY_RESTRICTED}
    GeoCategoryUnavailable:
      description: Категория POI отсутствует или выключена.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 422}
                  code: {const: INVALID_POI_CATEGORY}
    GeoPoiCreationRejected:
      description: Категория недоступна либо область POI несовместима с командой.
      content:
        application/problem+json:
          schema:
            oneOf:
              - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status: {const: 422}
                      code: {const: INVALID_POI_CATEGORY}
              - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status: {const: 422}
                      code: {const: POI_SCOPE_RESTRICTED}
    GeoPoiScopeRestricted:
      description: Область POI несовместима с командой.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 422}
                  code: {const: POI_SCOPE_RESTRICTED}
    GeoUnavailable:
      description: Обязательная зависимость Geo недоступна.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 503}
                  code: {const: DEPENDENCY_UNAVAILABLE}
    TravelInvalidRequest:
      description: Путь, параметры, заголовки или тело запроса недопустимы.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 400}
                  code: {const: INVALID_REQUEST}
    TravelSessionRequired:
      description: Требуется действующая сессия.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 401}
                  code: {const: SESSION_REQUIRED}
    TravelCsrfRejected:
      description: Origin или токен защиты запроса отклонён.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 403}
                  code: {const: CSRF_REJECTED}
    TravelDraftNotFound:
      description: Запрошенный ресурс отсутствует или недоступен владельцу сессии.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 404}
                  code: {const: NOT_FOUND}
    TravelKeyReused:
      description: Ключ уже занят другой командой или её результат недоступен.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 409}
                  code: {const: IDEMPOTENCY_KEY_REUSED}
    TravelWriteConflict:
      description: Текущая ревизия поездки изменилась либо ключ повтора занят.
      content:
        application/problem+json:
          schema:
            oneOf:
              - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status: {const: 409}
                      code: {const: TRIP_REVISION_CONFLICT}
                    required: [current_trip_revision_id]
              - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status: {const: 409}
                      code: {const: IDEMPOTENCY_KEY_REUSED}
    TravelInvalidDates:
      description: Диапазон поездки или дата дня не согласованы с программой.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 422}
                  code: {const: INVALID_TRIP_DATES}
    TravelUnavailable:
      description: Обязательная зависимость Travel или Identity недоступна.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 503}
                  code: {const: DEPENDENCY_UNAVAILABLE}
    IdentityInvalidRequest:
      description: Поля или формат запроса недопустимы.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 400}
                  code: {const: INVALID_REQUEST}
    IdentitySessionRequired:
      description: Требуется действующая сессия.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 401}
                  code: {const: SESSION_REQUIRED}
    IdentityInvalidCredentials:
      description: Вход отклонён. Проверьте учётные данные и подтверждение почты.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 401}
                  code: {const: INVALID_CREDENTIALS}
    IdentityCsrfRejected:
      description: Origin или токен защиты запроса отклонён.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 403}
                  code: {const: CSRF_REJECTED}
    IdentityNotFound:
      description: Профиль отсутствует или недоступен.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 404}
                  code: {const: NOT_FOUND}
    IdentityInvalidAuthToken:
      description: Ссылка недействительна или больше не может быть использована.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 422}
                  code: {const: INVALID_AUTH_TOKEN}
    IdentityAvatarUnavailable:
      description: Аватар недоступен для выбора.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 422}
                  code: {const: AVATAR_UNAVAILABLE}
    IdentityRateLimited:
      description: Слишком много попыток. Повторите запрос позже.
      headers:
        Retry-After:
          description: Время до повторной попытки в секундах.
          schema: {type: integer, minimum: 1}
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 429}
                  code: {const: RATE_LIMITED}
    IdentityUnavailable:
      description: Обязательная зависимость Identity недоступна.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 503}
                  code: {const: DEPENDENCY_UNAVAILABLE}
    BadRequest:
      description: Некорректный запрос, UUID, фильтр или обязательный заголовок
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Для операции нужна действующая сессия
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ForbiddenRequest:
      description: Запрос отклонён защитой CSRF
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Объект отсутствует или недоступен в этом контексте
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Изменилась ожидаемая ревизия или уже использован ключ команды
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Запрос формально корректен, но нарушает доменный инвариант
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Обязательный владелец состояния или прав временно недоступен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    IdentityProfile:
      type: object
      additionalProperties: false
      required: [id, display_name, bio, avatar, csrf_token]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        display_name: {type: string}
        bio: {type: [string, 'null']}
        avatar:
          anyOf:
            - $ref: '#/components/schemas/SystemAvatar'
            - type: 'null'
        csrf_token: {type: string, minLength: 1}
    PublicIdentityProfile:
      type: object
      additionalProperties: false
      required: [id, display_name, bio, avatar]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        display_name: {type: string}
        bio: {type: [string, 'null']}
        avatar:
          anyOf:
            - $ref: '#/components/schemas/SystemAvatar'
            - type: 'null'
    SystemAvatar:
      type: object
      additionalProperties: false
      required: [id, url]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        url: {type: string, format: uri-reference}
    SystemAvatarList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SystemAvatar'}
    RegisterIdentityRequest:
      type: object
      additionalProperties: false
      required: [email, password, accepted_terms]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
        accepted_terms: {const: true}
    LoginIdentityRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
    IdentityEmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 254}
    IdentityTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
    ResetIdentityPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
        password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
    UpdateIdentityProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: {type: string, minLength: 1, maxLength: 80}
        bio: {type: [string, 'null'], maxLength: 1000}
    SelectIdentityAvatarRequest:
      type: object
      additionalProperties: false
      required: [avatar_id]
      properties:
        avatar_id: {$ref: '#/components/schemas/Uuid'}
    Uuid:
      type: string
      format: uuid
    NullableUuid:
      anyOf:
        - $ref: '#/components/schemas/Uuid'
        - type: 'null'
    LonLat:
      type: object
      additionalProperties: false
      required: [lon, lat]
      properties:
        lon: {type: number, minimum: -180, maximum: 180}
        lat: {type: number, minimum: -90, maximum: 90}
    Position:
      type: array
      description: Пара WGS 84 в порядке longitude, latitude.
      prefixItems:
        - {type: number, minimum: -180, maximum: 180}
        - {type: number, minimum: -90, maximum: 90}
      minItems: 2
      items: false
    LineString:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: {type: string, const: LineString}
        coordinates:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Position'
    TripTitle:
      type: string
      minLength: 1
      maxLength: 120
    TripText:
      type: [string, 'null']
      maxLength: 4000
    TripDifficulty:
      type: [string, 'null']
      maxLength: 80
    TripCalendarDate:
      type: [string, 'null']
      format: date
    TripTimezone:
      type: [string, 'null']
      minLength: 1
      maxLength: 100
      description: Идентификатор часового пояса IANA.
    TripCapacity:
      type: [integer, 'null']
      minimum: 1
      maximum: 2147483647
    TripEquipment:
      type: array
      maxItems: 50
      items:
        $ref: '#/components/schemas/TripEquipmentItem'
    TripEquipmentItem:
      type: object
      additionalProperties: false
      required: [label, required]
      properties:
        label: {type: string, minLength: 1, maxLength: 120}
        required: {type: boolean}
    CreateTripDraftRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {$ref: '#/components/schemas/TripTitle'}
        description: {$ref: '#/components/schemas/TripText'}
        start_date: {$ref: '#/components/schemas/TripCalendarDate'}
        end_date: {$ref: '#/components/schemas/TripCalendarDate'}
        timezone: {$ref: '#/components/schemas/TripTimezone'}
        free_capacity: {$ref: '#/components/schemas/TripCapacity'}
        difficulty: {$ref: '#/components/schemas/TripDifficulty'}
        participation_rules: {$ref: '#/components/schemas/TripText'}
        equipment: {$ref: '#/components/schemas/TripEquipment'}
    UpdateTripDraftRequest:
      type: object
      additionalProperties: false
      required: [trip_revision_id]
      minProperties: 2
      properties:
        trip_revision_id: {$ref: '#/components/schemas/Uuid'}
        title: {$ref: '#/components/schemas/TripTitle'}
        description: {$ref: '#/components/schemas/TripText'}
        start_date: {$ref: '#/components/schemas/TripCalendarDate'}
        end_date: {$ref: '#/components/schemas/TripCalendarDate'}
        timezone: {$ref: '#/components/schemas/TripTimezone'}
        free_capacity: {$ref: '#/components/schemas/TripCapacity'}
        difficulty: {$ref: '#/components/schemas/TripDifficulty'}
        participation_rules: {$ref: '#/components/schemas/TripText'}
        equipment: {$ref: '#/components/schemas/TripEquipment'}
    AddTripDayRequest:
      type: object
      additionalProperties: false
      required: [trip_revision_id]
      properties:
        trip_revision_id: {$ref: '#/components/schemas/Uuid'}
        local_date: {$ref: '#/components/schemas/TripCalendarDate'}
        description: {$ref: '#/components/schemas/TripText'}
        notes: {$ref: '#/components/schemas/TripText'}
    UpdateTripDayRequest:
      type: object
      additionalProperties: false
      required: [trip_revision_id]
      minProperties: 2
      properties:
        trip_revision_id: {$ref: '#/components/schemas/Uuid'}
        local_date: {$ref: '#/components/schemas/TripCalendarDate'}
        description: {$ref: '#/components/schemas/TripText'}
        notes: {$ref: '#/components/schemas/TripText'}
    EnsureTripDayRouteRequest:
      type: object
      additionalProperties: false
      required: [trip_revision_id]
      properties:
        trip_revision_id: {$ref: '#/components/schemas/Uuid'}
    TripDraftSummary:
      type: object
      additionalProperties: false
      required: [trip_id, trip_revision_id, publication_id, visibility, title, start_date, end_date]
      properties:
        trip_id: {$ref: '#/components/schemas/Uuid'}
        trip_revision_id: {$ref: '#/components/schemas/Uuid'}
        publication_id: {$ref: '#/components/schemas/NullableUuid'}
        visibility: {type: string, enum: [public, private]}
        title: {$ref: '#/components/schemas/TripTitle'}
        start_date: {$ref: '#/components/schemas/TripCalendarDate'}
        end_date: {$ref: '#/components/schemas/TripCalendarDate'}
    MyTripDraftList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/TripDraftSummary'}}
        next_cursor: {$ref: '#/components/schemas/NullableUuid'}
    TripDraft:
      type: object
      additionalProperties: false
      required: [trip_id, trip_revision_id, publication_id, visibility, title, description, start_date, end_date, timezone, free_capacity, difficulty, participation_rules, equipment, days]
      properties:
        trip_id: {$ref: '#/components/schemas/Uuid'}
        trip_revision_id: {$ref: '#/components/schemas/Uuid'}
        publication_id: {$ref: '#/components/schemas/NullableUuid'}
        visibility: {type: string, enum: [public, private]}
        title: {$ref: '#/components/schemas/TripTitle'}
        description: {$ref: '#/components/schemas/TripText'}
        start_date: {$ref: '#/components/schemas/TripCalendarDate'}
        end_date: {$ref: '#/components/schemas/TripCalendarDate'}
        timezone: {$ref: '#/components/schemas/TripTimezone'}
        free_capacity: {$ref: '#/components/schemas/TripCapacity'}
        difficulty: {$ref: '#/components/schemas/TripDifficulty'}
        participation_rules: {$ref: '#/components/schemas/TripText'}
        equipment: {$ref: '#/components/schemas/TripEquipment'}
        days: {type: array, items: {$ref: '#/components/schemas/DraftDay'}}
    DraftDay:
      type: object
      additionalProperties: false
      required: [day_id, position, route_id, local_date, description, notes]
      properties:
        day_id: {$ref: '#/components/schemas/Uuid'}
        position: {type: integer, minimum: 1}
        route_id: {$ref: '#/components/schemas/NullableUuid'}
        local_date: {$ref: '#/components/schemas/TripCalendarDate'}
        description: {$ref: '#/components/schemas/TripText'}
        notes: {$ref: '#/components/schemas/TripText'}
    GeoBuildMode:
      type: string
      enum: [automatic, straight]
    GeoTransportMode:
      type: string
      enum: [car, bicycle, foot]
    ReplaceRouteDraft:
      type: object
      description: Полный упорядоченный снимок. Максимальный размер JSON — 256 КиБ.
      additionalProperties: false
      required: [route_revision_id, points, tracks]
      properties:
        route_revision_id: {$ref: '#/components/schemas/NullableUuid'}
        points: {type: array, items: {$ref: '#/components/schemas/RoutePointInput'}}
        tracks: {type: array, items: {$ref: '#/components/schemas/RouteTrackInput'}}
    RestoreRouteDraft:
      type: object
      additionalProperties: false
      required: [route_revision_id, target_revision_id]
      properties:
        route_revision_id: {$ref: '#/components/schemas/NullableUuid'}
        target_revision_id: {$ref: '#/components/schemas/Uuid'}
    RoutePointInput:
      type: object
      additionalProperties: false
      required: [position]
      properties:
        point_id: {$ref: '#/components/schemas/Uuid'}
        position: {$ref: '#/components/schemas/LonLat'}
        poi_id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string, maxLength: 120}
        description: {type: string, maxLength: 4000}
    RouteTrackInput:
      type: object
      additionalProperties: false
      required: [build_mode, transport_mode]
      properties:
        track_id: {$ref: '#/components/schemas/Uuid'}
        build_mode: {$ref: '#/components/schemas/GeoBuildMode'}
        transport_mode: {$ref: '#/components/schemas/GeoTransportMode'}
        confirm_snap:
          description: Подтверждённые координаты привязки обоих концов и версия графа из предпросмотра. Только для automatic.
          type: object
          additionalProperties: false
          required: [from, to, graph_version]
          properties:
            from: {$ref: '#/components/schemas/LonLat'}
            to: {$ref: '#/components/schemas/LonLat'}
            graph_version: {type: string, minLength: 1, maxLength: 256}
        name: {type: string, maxLength: 120}
        description: {type: string, maxLength: 4000}
    RouteTrackPreviewRequest:
      type: object
      additionalProperties: false
      required: [from, to, transport_mode]
      properties:
        from: {$ref: '#/components/schemas/LonLat'}
        to: {$ref: '#/components/schemas/LonLat'}
        transport_mode: {$ref: '#/components/schemas/GeoTransportMode'}
        build_mode:
          $ref: '#/components/schemas/GeoBuildMode'
          default: automatic
    RouteTrackPreview:
      type: object
      additionalProperties: false
      required: [status, from, to, geometry, distance_m, duration_s, provider, graph_version, alternatives]
      properties:
        status: {type: string, enum: [available, unavailable]}
        reason: {type: string, enum: [no_edge, disconnected, outside_coverage]}
        from: {$ref: '#/components/schemas/RoutePreviewEnd'}
        to: {$ref: '#/components/schemas/RoutePreviewEnd'}
        geometry:
          anyOf:
            - $ref: '#/components/schemas/GeoCoordinates'
            - type: 'null'
        distance_m: {type: [number, 'null'], minimum: 0}
        duration_s: {type: [number, 'null'], minimum: 0}
        provider: {type: [string, 'null']}
        graph_version: {type: [string, 'null']}
        alternatives: {type: array, items: {$ref: '#/components/schemas/RoutePreviewAlternative'}}
        elevation_profile: {$ref: '#/components/schemas/TrackElevation'}
    GeoCoordinates:
      type: array
      minItems: 2
      items:
        type: array
        minItems: 2
        maxItems: 2
        prefixItems:
          - {type: number, minimum: -180, maximum: 180}
          - {type: number, minimum: -90, maximum: 90}
    RoutePreviewEnd:
      type: object
      additionalProperties: false
      required: [requested, snapped, distance_m]
      properties:
        requested: {$ref: '#/components/schemas/LonLat'}
        snapped:
          anyOf:
            - $ref: '#/components/schemas/LonLat'
            - type: 'null'
        distance_m: {type: [number, 'null'], minimum: 0}
    RoutePreviewAlternative:
      type: object
      additionalProperties: false
      required: [build_mode, transport_mode, geometry, distance_m, duration_s]
      properties:
        build_mode: {$ref: '#/components/schemas/GeoBuildMode'}
        transport_mode: {$ref: '#/components/schemas/GeoTransportMode'}
        geometry: {$ref: '#/components/schemas/GeoCoordinates'}
        distance_m: {type: number, minimum: 0}
        duration_s: {type: [number, 'null'], minimum: 0}
        connection:
          type: string
          const: snapped_finish
          description: Продолжение от предложенного конца к исходной точке. Без поля вариант заменяет весь трек.
        warning: {type: string, const: unverified_passability}
    PoiCategories:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [category_id, code, label]
            properties:
              category_id: {$ref: '#/components/schemas/Uuid'}
              code: {type: string}
              label: {type: string}
    CreatePoiRequest:
      type: object
      additionalProperties: false
      required: [category_id, name, position, visibility]
      properties:
        category_id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: [string, 'null'], maxLength: 4000}
        position: {$ref: '#/components/schemas/LonLat'}
        visibility: {type: string, enum: [global, private, trip]}
        scope_trip_id: {$ref: '#/components/schemas/Uuid'}
      if:
        properties:
          visibility: {const: trip}
      then:
        required: [scope_trip_id]
      else:
        not:
          required: [scope_trip_id]
    UpdatePoiRequest:
      type: object
      additionalProperties: false
      required: [poi_revision_id]
      minProperties: 2
      properties:
        poi_revision_id: {$ref: '#/components/schemas/Uuid'}
        category_id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: [string, 'null'], maxLength: 4000}
        position: {$ref: '#/components/schemas/LonLat'}
    PoiRevisionCommand:
      type: object
      additionalProperties: false
      required: [poi_revision_id]
      properties:
        poi_revision_id: {$ref: '#/components/schemas/Uuid'}
    ModeratePoiRequest:
      type: object
      additionalProperties: false
      required: [poi_revision_id, decision]
      properties:
        poi_revision_id: {$ref: '#/components/schemas/Uuid'}
        decision: {type: string, enum: [approved, rejected]}
        reason: {type: string, minLength: 1, maxLength: 1000}
    RouteDraft:
      oneOf:
        - $ref: '#/components/schemas/ReadableRouteDraft'
        - $ref: '#/components/schemas/RestrictedRouteDraft'
    ReadableRouteDraft:
      type: object
      additionalProperties: false
      required: [availability, route_id, route_revision_id, points, tracks, trip_type]
      properties:
        availability: {type: string, const: available}
        route_id: {$ref: '#/components/schemas/Uuid'}
        route_revision_id: {$ref: '#/components/schemas/NullableUuid'}
        trip_type: {enum: [car, bicycle, foot, combined, null]}
        points:
          type: array
          items:
            $ref: '#/components/schemas/RoutePoint'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/Track'
    RestrictedRouteDraft:
      type: object
      additionalProperties: false
      required: [availability, route_id, route_revision_id]
      properties:
        availability: {type: string, const: geometry_restricted}
        route_id: {$ref: '#/components/schemas/Uuid'}
        route_revision_id: {$ref: '#/components/schemas/Uuid'}
    RoutePoint:
      type: object
      additionalProperties: false
      required: [point_id, position]
      properties:
        point_id: {$ref: '#/components/schemas/Uuid'}
        position: {$ref: '#/components/schemas/LonLat'}
        poi_id: {$ref: '#/components/schemas/Uuid'}
        requested_position: {$ref: '#/components/schemas/LonLat'}
        snapped_position: {$ref: '#/components/schemas/LonLat'}
        name: {type: string}
        description: {type: string}
    Track:
      type: object
      additionalProperties: false
      required: [track_id, start_point_id, end_point_id, geometry, status, build_mode, transport_mode, distance_m, ascent_m, descent_m, min_elevation_m, max_elevation_m]
      properties:
        track_id: {$ref: '#/components/schemas/Uuid'}
        start_point_id: {$ref: '#/components/schemas/Uuid'}
        end_point_id: {$ref: '#/components/schemas/Uuid'}
        geometry: {$ref: '#/components/schemas/LineString'}
        status: {type: string, enum: [ready, needs_rebuild]}
        build_mode: {$ref: '#/components/schemas/GeoBuildMode'}
        transport_mode: {$ref: '#/components/schemas/GeoTransportMode'}
        distance_m: {type: number, minimum: 0}
        ascent_m: {type: [number, 'null'], minimum: 0}
        descent_m: {type: [number, 'null'], minimum: 0}
        min_elevation_m: {type: [number, 'null']}
        max_elevation_m: {type: [number, 'null']}
        estimated_duration_s: {type: integer, minimum: 0}
        routing_provider: {type: string}
        route_source_version: {type: string}
        elevation_profile: {$ref: '#/components/schemas/TrackElevation'}
        name: {type: string}
        description: {type: string}
    TrackElevation:
      type: object
      additionalProperties: false
      required: [ascent_m, descent_m, min_elevation_m, max_elevation_m, profile, source, version, covered_distance_m, vertical_datum, method]
      properties:
        ascent_m: {type: [number, 'null'], minimum: 0}
        descent_m: {type: [number, 'null'], minimum: 0}
        min_elevation_m: {type: [number, 'null']}
        max_elevation_m: {type: [number, 'null']}
        profile:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [distance_m, elevation_m]
            properties:
              distance_m: {type: number, minimum: 0}
              elevation_m: {type: [number, 'null']}
        source: {enum: [copernicus-dem-glo-30-public, null]}
        version: {type: [string, 'null']}
        covered_distance_m: {type: number, minimum: 0}
        vertical_datum: {enum: [EGM2008, null]}
        method: {type: [string, 'null']}
    SplitCommand:
      type: object
      additionalProperties: false
      required: [route_id, route_revision_id, split_position]
      properties:
        route_id: {$ref: '#/components/schemas/Uuid'}
        route_revision_id: {$ref: '#/components/schemas/Uuid'}
        split_position: {$ref: '#/components/schemas/LonLat'}
    SplitResult:
      type: object
      additionalProperties: false
      required: [route_id, route_revision_id, point_id, track_ids]
      properties:
        route_id: {$ref: '#/components/schemas/Uuid'}
        route_revision_id: {$ref: '#/components/schemas/Uuid'}
        point_id: {$ref: '#/components/schemas/Uuid'}
        track_ids:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
    PublishCommand:
      type: object
      additionalProperties: false
      required: [trip_revision_id, routes, poi_ids]
      properties:
        trip_revision_id: {$ref: '#/components/schemas/Uuid'}
        routes:
          type: array
          minItems: 1
          maxItems: 100
          description: Один элемент на день черновика в порядке дней. Принадлежность, полноту и уникальность проверяет Travel.
          items:
            $ref: '#/components/schemas/PublishRoute'
        poi_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          description: Явно выбранные глобальные POI для отдельного слоя. Пустой массив отключает слой.
          items:
            $ref: '#/components/schemas/Uuid'
    PublishRoute:
      type: object
      additionalProperties: false
      required: [day_id, route_id, route_revision_id]
      properties:
        day_id: {$ref: '#/components/schemas/Uuid'}
        route_id: {$ref: '#/components/schemas/Uuid'}
        route_revision_id: {$ref: '#/components/schemas/Uuid'}
    PublicationPending:
      type: object
      additionalProperties: false
      required: [operation_id, status]
      properties:
        operation_id: {$ref: '#/components/schemas/Uuid'}
        status: {type: string, const: pending}
    PublicationSucceeded:
      type: object
      additionalProperties: false
      required: [operation_id, status, publication_id, trip_revision_id]
      properties:
        operation_id: {$ref: '#/components/schemas/Uuid'}
        status: {type: string, const: succeeded}
        publication_id:
          $ref: '#/components/schemas/Uuid'
          description: ID снимка, записанного этой операцией. Актуальная публичная доступность проверяется отдельно.
        trip_revision_id:
          $ref: '#/components/schemas/Uuid'
          description: Ревизия поездки сразу после операции. Запрос черновика возвращает текущее значение.
    PublicationFailed:
      type: object
      additionalProperties: false
      required: [operation_id, status, code]
      properties:
        operation_id: {$ref: '#/components/schemas/Uuid'}
        status: {type: string, const: failed}
        code:
          type: string
          enum: [TRIP_REVISION_CONFLICT, ROUTE_REVISION_CONFLICT, ROUTE_NOT_READY, POI_PUBLICATION_RESTRICTED, PUBLICATION_PRECONDITION_FAILED, PUBLICATION_CANCELLED, PUBLICATION_TIMED_OUT]
    PublicationTerminal:
      oneOf:
        - $ref: '#/components/schemas/PublicationSucceeded'
        - $ref: '#/components/schemas/PublicationFailed'
    PublicationOperation:
      oneOf:
        - $ref: '#/components/schemas/PublicationPending'
        - $ref: '#/components/schemas/PublicationSucceeded'
        - $ref: '#/components/schemas/PublicationFailed'
    UnpublishCommand:
      type: object
      additionalProperties: false
      required: [trip_revision_id, publication_id]
      properties:
        trip_revision_id: {$ref: '#/components/schemas/Uuid'}
        publication_id:
          $ref: '#/components/schemas/NullableUuid'
          description: Текущий указатель. null позволяет остановить ещё не завершённую первую публикацию.
    UnpublishResult:
      type: object
      additionalProperties: false
      required: [publication_id, trip_revision_id]
      properties:
        publication_id: {type: 'null'}
        trip_revision_id: {$ref: '#/components/schemas/Uuid'}
    PublicTripSummary:
      type: object
      additionalProperties: false
      required: [trip_id, publication_id, title, start]
      properties:
        trip_id: {$ref: '#/components/schemas/Uuid'}
        publication_id: {$ref: '#/components/schemas/Uuid'}
        title: {type: string}
        start:
          $ref: '#/components/schemas/LonLat'
          description: Первая точка разрешённой закреплённой Geo-ревизии первого дня.
    PublicTrip:
      type: object
      additionalProperties: false
      required: [trip_id, publication_id, title, description, days, pois]
      properties:
        trip_id: {$ref: '#/components/schemas/Uuid'}
        publication_id: {$ref: '#/components/schemas/Uuid'}
        title: {type: string}
        description: {type: string}
        days:
          type: array
          items:
            $ref: '#/components/schemas/PublicDay'
        pois:
          type: array
          items:
            $ref: '#/components/schemas/PublicPoi'
    PublicDay:
      type: object
      additionalProperties: false
      required: [position, lines]
      properties:
        position: {type: integer, minimum: 1}
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LineString'
    PublicTripPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicTripSummary'
        next_cursor: {type: [string, 'null']}
    PublicPoi:
      type: object
      additionalProperties: false
      required: [poi_id, name, position]
      properties:
        poi_id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        position: {$ref: '#/components/schemas/LonLat'}
    Poi:
      type: object
      additionalProperties: false
      required: [poi_id, category_id, name, position, media]
      properties:
        poi_id: {$ref: '#/components/schemas/Uuid'}
        category_id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        description: {type: string}
        position: {$ref: '#/components/schemas/LonLat'}
        poi_revision_id:
          $ref: '#/components/schemas/Uuid'
          description: Присутствует у автора при действующем доступе к области POI.
        visibility: {type: string, enum: [global, private, trip]}
        moderation_status: {type: string, enum: [pending, approved, rejected]}
        scope_trip_id: {$ref: '#/components/schemas/Uuid'}
        media:
          type: array
          items:
            $ref: '#/components/schemas/PoiMedia'
      dependentRequired:
        poi_revision_id: [visibility, moderation_status]
        visibility: [poi_revision_id]
        moderation_status: [poi_revision_id]
        scope_trip_id: [poi_revision_id]
      if:
        required: [visibility]
        properties:
          visibility: {const: trip}
      then:
        required: [scope_trip_id]
      else:
        not:
          required: [scope_trip_id]
    PoiMedia:
      type: object
      additionalProperties: false
      required: [media_id, href]
      properties:
        media_id: {$ref: '#/components/schemas/Uuid'}
        href:
          type: string
          format: uri-reference
          description: Относительная ссылка BFF, доступ проверяется заново при её открытии.
    PoiPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Poi'
        next_cursor: {type: [string, 'null']}
    ChangePoiVisibility:
      type: object
      additionalProperties: false
      required: [poi_revision_id, visibility]
      properties:
        poi_revision_id: {$ref: '#/components/schemas/Uuid'}
        visibility: {type: string, enum: [global, private, trip]}
        scope_trip_id: {$ref: '#/components/schemas/Uuid'}
      if:
        properties:
          visibility: {const: trip}
      then:
        required: [scope_trip_id]
      else:
        not:
          required: [scope_trip_id]
    PoiVisibilityResult:
      type: object
      additionalProperties: false
      required: [poi_id, poi_revision_id, visibility, moderation_status]
      properties:
        poi_id: {$ref: '#/components/schemas/Uuid'}
        poi_revision_id: {$ref: '#/components/schemas/Uuid'}
        visibility: {type: string, enum: [global, private, trip]}
        moderation_status: {type: string, enum: [pending, approved, rejected]}
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {type: string}
        request_id: {$ref: '#/components/schemas/Uuid'}
        current_trip_revision_id: {$ref: '#/components/schemas/Uuid'}
        current_route_revision_id: {$ref: '#/components/schemas/Uuid'}
        current_poi_revision_id: {$ref: '#/components/schemas/Uuid'}
