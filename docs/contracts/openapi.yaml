openapi: 3.1.1
info:
  title: Tropio GIS MVP
  version: 0.4.0
  description: |
    Внешний API BFF. Identity реализован в GIS-02, черновики Travel в GIS-03. Редактор маршрутов, расчёт треков и POI реализованы в GIS-04. Публикация относится к проекту POC-04.
    Каждый ответ этого контракта получает Cache-Control: no-store и X-Request-Id.
    Недоступные или неизвестные объекты дают одинаковый 404. Публичные операции
    используют гостевой контекст, даже если браузер отправил сессию.
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /auth/register:
    post:
      operationId: registerIdentity
      tags: [Identity]
      summary: Начать регистрацию по email
      description: Identity принимает заявку на регистрацию. Ответ одинаков для новых и известных адресов. Учётная запись создаётся при подтверждении адреса.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIdentityRequest'
      responses:
        '202':
          description: Запрос принят.
          headers:
            Set-Cookie:
              description: Обновление cookie tropio_registration.
              schema: {type: string}
        '400':
          $ref: '#/components/responses/IdentityInvalidRequest'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '429':
          $ref: '#/components/responses/IdentityRateLimited'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /auth/resend-verification:
    post:
      operationId: resendIdentityVerification
      tags: [Identity]
      summary: Повторить запрос подтверждения адреса
      description: Повтор использует cookie исходного браузера. Ответ одинаков при любом состоянии регистрации.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityEmailRequest'
      responses:
        '202':
          description: Запрос принят.
          headers:
            Set-Cookie:
              description: При наличии регистрационной cookie браузер может получить её обновление.
              schema: {type: string}
        '400':
          $ref: '#/components/responses/IdentityInvalidRequest'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '429':
          $ref: '#/components/responses/IdentityRateLimited'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /auth/verify-email:
    post:
      operationId: verifyIdentityEmail
      tags: [Identity]
      summary: Подтвердить адрес электронной почты
      description: Откройте ссылку в браузере, где началась регистрация. Identity однократно создаёт аккаунт и назначает случайный активный системный аватар.
      security:
        - registration: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityTokenRequest'
      responses:
        '204':
          description: Операция выполнена.
          headers:
            Set-Cookie:
              description: Обновление cookie tropio_registration.
              schema: {type: string}
        '400':
          $ref: '#/components/responses/IdentityInvalidRequest'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '422':
          $ref: '#/components/responses/IdentityInvalidAuthToken'
        '429':
          $ref: '#/components/responses/IdentityRateLimited'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /auth/login:
    post:
      operationId: loginIdentity
      tags: [Identity]
      summary: Войти по email и паролю
      description: Identity выдаёт сессию после подтверждения адреса. Ответ об ошибке не раскрывает состояние аккаунта.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIdentityRequest'
      responses:
        '200':
          description: Актуальные данные.
          headers:
            Set-Cookie:
              description: Обновление cookie tropio_session.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProfile'
        '400':
          $ref: '#/components/responses/IdentityInvalidRequest'
        '401':
          $ref: '#/components/responses/IdentityInvalidCredentials'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '429':
          $ref: '#/components/responses/IdentityRateLimited'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /auth/refresh:
    post:
      operationId: refreshIdentitySession
      tags: [Identity]
      summary: Обновить сессию
      description: При успешном обновлении прежний токен сессии перестаёт действовать.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      responses:
        '200':
          description: Актуальные данные.
          headers:
            Set-Cookie:
              description: Обновление cookie tropio_session.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProfile'
        '401':
          $ref: '#/components/responses/IdentitySessionRequired'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /auth/logout:
    post:
      operationId: logoutIdentity
      tags: [Identity]
      summary: Завершить текущую сессию
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      responses:
        '204':
          description: Операция выполнена.
          headers:
            Set-Cookie:
              description: Обновление cookie tropio_session.
              schema: {type: string}
        '401':
          $ref: '#/components/responses/IdentitySessionRequired'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /auth/request-password-reset:
    post:
      operationId: requestIdentityPasswordReset
      tags: [Identity]
      summary: Запросить восстановление пароля
      description: Ответ одинаков для известных и неизвестных адресов.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityEmailRequest'
      responses:
        '202':
          description: Запрос принят.
        '400':
          $ref: '#/components/responses/IdentityInvalidRequest'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '429':
          $ref: '#/components/responses/IdentityRateLimited'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /auth/reset-password:
    post:
      operationId: resetIdentityPassword
      tags: [Identity]
      summary: Установить новый пароль по ссылке
      description: При успешной установке пароля Identity отзывает прежние сессии.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetIdentityPasswordRequest'
      responses:
        '204':
          description: Операция выполнена.
        '400':
          $ref: '#/components/responses/IdentityInvalidRequest'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '422':
          $ref: '#/components/responses/IdentityInvalidAuthToken'
        '429':
          $ref: '#/components/responses/IdentityRateLimited'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /me:
    get:
      operationId: readMyIdentityProfile
      tags: [Identity]
      summary: Получить собственный профиль
      security:
        - session: []
      responses:
        '200':
          description: Актуальные данные.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProfile'
        '401':
          $ref: '#/components/responses/IdentitySessionRequired'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
    patch:
      operationId: updateMyIdentityProfile
      tags: [Identity]
      summary: Изменить имя и описание собственного профиля
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIdentityProfileRequest'
      responses:
        '200':
          description: Актуальные данные.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProfile'
        '400':
          $ref: '#/components/responses/IdentityInvalidRequest'
        '401':
          $ref: '#/components/responses/IdentitySessionRequired'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /me/avatar:
    patch:
      operationId: selectMyIdentityAvatar
      tags: [Identity]
      summary: Выбрать системный аватар
      description: Операция изменяет аватар собственного профиля.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectIdentityAvatarRequest'
      responses:
        '200':
          description: Актуальные данные.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProfile'
        '400':
          $ref: '#/components/responses/IdentityInvalidRequest'
        '401':
          $ref: '#/components/responses/IdentitySessionRequired'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '422':
          $ref: '#/components/responses/IdentityAvatarUnavailable'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /avatar-assets:
    get:
      operationId: listIdentityAvatarAssets
      tags: [Identity]
      summary: Получить доступные системные аватары
      security: []
      responses:
        '200':
          description: Актуальные данные.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemAvatarList'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /users/{id}:
    get:
      operationId: readPublicIdentityProfile
      tags: [Identity]
      summary: Получить публичный профиль
      description: Identity включает только доступные посетителю поля.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Актуальные данные.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicIdentityProfile'
        '400':
          $ref: '#/components/responses/IdentityInvalidRequest'
        '404':
          $ref: '#/components/responses/IdentityNotFound'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /trips:
    get:
      operationId: listMyTripDrafts
      tags: [Travel drafts]
      summary: Открыть список своих поездок
      description: Сортировка по UUID поездки. Курсор применяется в контексте действующей сессии.
      parameters:
        - $ref: '#/components/parameters/MyTripsCursor'
        - $ref: '#/components/parameters/MyTripsLimit'
      responses:
        '200':
          description: Текущее состояние.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTripDraftList'
        '400':
          $ref: '#/components/responses/TravelInvalidRequest'
        '401':
          $ref: '#/components/responses/TravelSessionRequired'
        '503':
          $ref: '#/components/responses/TravelUnavailable'
    post:
      operationId: createTripDraft
      tags: [Travel drafts]
      summary: Создать черновик поездки
      description: Достаточно названия. Travel создаёт первый день без привязки маршрута.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripDraftRequest'
      responses:
        '201':
          description: Сохранённый результат.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDraft'
        '400':
          $ref: '#/components/responses/TravelInvalidRequest'
        '401':
          $ref: '#/components/responses/TravelSessionRequired'
        '403':
          $ref: '#/components/responses/TravelCsrfRejected'
        '409':
          $ref: '#/components/responses/TravelKeyReused'
        '422':
          $ref: '#/components/responses/TravelInvalidDates'
        '503':
          $ref: '#/components/responses/TravelUnavailable'
  /trips/{tripId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
    patch:
      operationId: updateTripDraft
      tags: [Travel drafts]
      summary: Сохранить поля черновика поездки
      description: Изменения сохраняются в текущий черновик.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripDraftRequest'
      responses:
        '200':
          description: Сохранённый результат.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDraft'
        '400':
          $ref: '#/components/responses/TravelInvalidRequest'
        '401':
          $ref: '#/components/responses/TravelSessionRequired'
        '403':
          $ref: '#/components/responses/TravelCsrfRejected'
        '404':
          $ref: '#/components/responses/TravelDraftNotFound'
        '409':
          $ref: '#/components/responses/TravelWriteConflict'
        '422':
          $ref: '#/components/responses/TravelInvalidDates'
        '503':
          $ref: '#/components/responses/TravelUnavailable'
  /trips/{tripId}/draft:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      operationId: getTripDraft
      tags: [Travel drafts]
      summary: Получить черновик поездки для редактора
      description: Возвращает поля Travel, активные дни и привязки маршрутов.
      responses:
        '200':
          description: Текущее состояние.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDraft'
        '400':
          $ref: '#/components/responses/TravelInvalidRequest'
        '401':
          $ref: '#/components/responses/TravelSessionRequired'
        '404':
          $ref: '#/components/responses/TravelDraftNotFound'
        '503':
          $ref: '#/components/responses/TravelUnavailable'
  /trips/{tripId}/days:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      operationId: addTripDay
      tags: [Travel drafts]
      summary: Добавить день в поездку
      description: День получает следующую позицию в программе.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTripDayRequest'
      responses:
        '201':
          description: Сохранённый результат.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDraft'
        '400':
          $ref: '#/components/responses/TravelInvalidRequest'
        '401':
          $ref: '#/components/responses/TravelSessionRequired'
        '403':
          $ref: '#/components/responses/TravelCsrfRejected'
        '404':
          $ref: '#/components/responses/TravelDraftNotFound'
        '409':
          $ref: '#/components/responses/TravelWriteConflict'
        '422':
          $ref: '#/components/responses/TravelInvalidDates'
        '503':
          $ref: '#/components/responses/TravelUnavailable'
  /days/{dayId}:
    parameters:
      - $ref: '#/components/parameters/TravelDayId'
    patch:
      operationId: updateTripDay
      tags: [Travel drafts]
      summary: Сохранить дату, описание и заметки дня
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripDayRequest'
      responses:
        '200':
          description: Сохранённый результат.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDraft'
        '400':
          $ref: '#/components/responses/TravelInvalidRequest'
        '401':
          $ref: '#/components/responses/TravelSessionRequired'
        '403':
          $ref: '#/components/responses/TravelCsrfRejected'
        '404':
          $ref: '#/components/responses/TravelDraftNotFound'
        '409':
          $ref: '#/components/responses/TravelWriteConflict'
        '422':
          $ref: '#/components/responses/TravelInvalidDates'
        '503':
          $ref: '#/components/responses/TravelUnavailable'
  /days/{dayId}/route:
    parameters:
      - $ref: '#/components/parameters/TravelDayId'
    put:
      operationId: ensureTripDayRoute
      tags: [Travel drafts]
      summary: Получить или создать привязку маршрута к дню
      description: Travel назначает UUID при первой привязке. Существующая привязка возвращается без новой ревизии. Геометрия относится к Geo.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnsureTripDayRouteRequest'
      responses:
        '200':
          description: Сохранённый результат.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDraft'
        '400':
          $ref: '#/components/responses/TravelInvalidRequest'
        '401':
          $ref: '#/components/responses/TravelSessionRequired'
        '403':
          $ref: '#/components/responses/TravelCsrfRejected'
        '404':
          $ref: '#/components/responses/TravelDraftNotFound'
        '409':
          $ref: '#/components/responses/TravelWriteConflict'
        '503':
          $ref: '#/components/responses/TravelUnavailable'
  /trips/{tripId}/publish:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      operationId: publishTrip
      summary: Запустить явную публикацию набора точных ревизий
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishCommand'
      responses:
        '202':
          description: Операция записана, результат ожидается
          headers:
            Location:
              description: Относительный URL состояния этой операции
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationPending'
        '200':
          description: Результат существующей завершённой операции с тем же ключом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationTerminal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /trips/{tripId}/publication-operations/{operationId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - name: operationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      operationId: getPublicationOperation
      summary: Получить состояние операции публикации
      responses:
        '200':
          description: Состояние, видимое текущему уполномоченному инициатору
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationOperation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /trips/{tripId}/unpublish:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      operationId: unpublishTrip
      summary: Снять текущую публикацию и остановить конкурентные публикации
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnpublishCommand'
      responses:
        '200':
          description: Travel вернул пустой указатель после снятия, отмены подготовки или подтверждения уже пустого состояния
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnpublishResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /catalog/trips:
    get:
      operationId: listPublicTrips
      summary: Получить общий набор результатов для списка и карты
      security: []
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Публичные строки после актуальной серверной фильтрации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTripPage'
        '400':
