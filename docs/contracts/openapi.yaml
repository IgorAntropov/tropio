openapi: 3.1.1
info:
  title: Tropio GIS MVP
  version: 0.2.0
  description: |
    Внешний API BFF. Identity описывает GIS-02. URL и UUID-ревизии Travel и Geo относятся к проекту POC-04.
    Каждый ответ этого контракта получает Cache-Control: no-store и X-Request-Id.
    Недоступные или неизвестные объекты дают одинаковый 404. Публичные операции
    используют гостевой контекст, даже если браузер отправил сессию.
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /auth/register:
    post:
      operationId: registerIdentity
      tags: [Identity]
      summary: Начать регистрацию по email
      description: Identity принимает заявку на регистрацию. Ответ одинаков для новых и известных адресов. Учётная запись создаётся при подтверждении адреса.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIdentityRequest'
      responses:
        '202':
          description: Запрос принят.
          headers:
            Set-Cookie:
              description: Обновление cookie tropio_registration.
              schema: {type: string}
        '400':
          $ref: '#/components/responses/IdentityInvalidRequest'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '429':
          $ref: '#/components/responses/IdentityRateLimited'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /auth/resend-verification:
    post:
      operationId: resendIdentityVerification
      tags: [Identity]
      summary: Повторить запрос подтверждения адреса
      description: Повтор использует cookie исходного браузера. Ответ одинаков при любом состоянии регистрации.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityEmailRequest'
      responses:
        '202':
          description: Запрос принят.
          headers:
            Set-Cookie:
              description: При наличии регистрационной cookie браузер может получить её обновление.
              schema: {type: string}
        '400':
          $ref: '#/components/responses/IdentityInvalidRequest'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '429':
          $ref: '#/components/responses/IdentityRateLimited'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /auth/verify-email:
    post:
      operationId: verifyIdentityEmail
      tags: [Identity]
      summary: Подтвердить адрес электронной почты
      description: Откройте ссылку в браузере, где началась регистрация. Identity однократно создаёт аккаунт и назначает случайный активный системный аватар.
      security:
        - registration: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityTokenRequest'
      responses:
        '204':
          description: Операция выполнена.
          headers:
            Set-Cookie:
              description: Обновление cookie tropio_registration.
              schema: {type: string}
        '400':
          $ref: '#/components/responses/IdentityInvalidRequest'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '422':
          $ref: '#/components/responses/IdentityInvalidAuthToken'
        '429':
          $ref: '#/components/responses/IdentityRateLimited'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /auth/login:
    post:
      operationId: loginIdentity
      tags: [Identity]
      summary: Войти по email и паролю
      description: Identity выдаёт сессию после подтверждения адреса. Ответ об ошибке не раскрывает состояние аккаунта.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIdentityRequest'
      responses:
        '200':
          description: Актуальные данные.
          headers:
            Set-Cookie:
              description: Обновление cookie tropio_session.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProfile'
        '400':
          $ref: '#/components/responses/IdentityInvalidRequest'
        '401':
          $ref: '#/components/responses/IdentityInvalidCredentials'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '429':
          $ref: '#/components/responses/IdentityRateLimited'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /auth/refresh:
    post:
      operationId: refreshIdentitySession
      tags: [Identity]
      summary: Обновить сессию
      description: При успешном обновлении прежний токен сессии перестаёт действовать.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      responses:
        '200':
          description: Актуальные данные.
          headers:
            Set-Cookie:
              description: Обновление cookie tropio_session.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProfile'
        '401':
          $ref: '#/components/responses/IdentitySessionRequired'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /auth/logout:
    post:
      operationId: logoutIdentity
      tags: [Identity]
      summary: Завершить текущую сессию
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      responses:
        '204':
          description: Операция выполнена.
          headers:
            Set-Cookie:
              description: Обновление cookie tropio_session.
              schema: {type: string}
        '401':
          $ref: '#/components/responses/IdentitySessionRequired'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /auth/request-password-reset:
    post:
      operationId: requestIdentityPasswordReset
      tags: [Identity]
      summary: Запросить восстановление пароля
      description: Ответ одинаков для известных и неизвестных адресов.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityEmailRequest'
      responses:
        '202':
          description: Запрос принят.
        '400':
          $ref: '#/components/responses/IdentityInvalidRequest'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '429':
          $ref: '#/components/responses/IdentityRateLimited'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /auth/reset-password:
    post:
      operationId: resetIdentityPassword
      tags: [Identity]
      summary: Установить новый пароль по ссылке
      description: При успешной установке пароля Identity отзывает прежние сессии.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetIdentityPasswordRequest'
      responses:
        '204':
          description: Операция выполнена.
        '400':
          $ref: '#/components/responses/IdentityInvalidRequest'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '422':
          $ref: '#/components/responses/IdentityInvalidAuthToken'
        '429':
          $ref: '#/components/responses/IdentityRateLimited'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /me:
    get:
      operationId: readMyIdentityProfile
      tags: [Identity]
      summary: Получить собственный профиль
      security:
        - session: []
      responses:
        '200':
          description: Актуальные данные.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProfile'
        '401':
          $ref: '#/components/responses/IdentitySessionRequired'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
    patch:
      operationId: updateMyIdentityProfile
      tags: [Identity]
      summary: Изменить имя и описание собственного профиля
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIdentityProfileRequest'
      responses:
        '200':
          description: Актуальные данные.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProfile'
        '400':
          $ref: '#/components/responses/IdentityInvalidRequest'
        '401':
          $ref: '#/components/responses/IdentitySessionRequired'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /me/avatar:
    patch:
      operationId: selectMyIdentityAvatar
      tags: [Identity]
      summary: Выбрать системный аватар
      description: Операция изменяет аватар собственного профиля.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectIdentityAvatarRequest'
      responses:
        '200':
          description: Актуальные данные.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProfile'
        '400':
          $ref: '#/components/responses/IdentityInvalidRequest'
        '401':
          $ref: '#/components/responses/IdentitySessionRequired'
        '403':
          $ref: '#/components/responses/IdentityCsrfRejected'
        '422':
          $ref: '#/components/responses/IdentityAvatarUnavailable'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /avatar-assets:
    get:
      operationId: listIdentityAvatarAssets
      tags: [Identity]
      summary: Получить доступные системные аватары
      security: []
      responses:
        '200':
          description: Актуальные данные.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemAvatarList'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /users/{id}:
    get:
      operationId: readPublicIdentityProfile
      tags: [Identity]
      summary: Получить публичный профиль
      description: Identity включает только доступные посетителю поля.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Актуальные данные.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicIdentityProfile'
        '400':
          $ref: '#/components/responses/IdentityInvalidRequest'
        '404':
          $ref: '#/components/responses/IdentityNotFound'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /trips/{tripId}/draft:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      operationId: getTripDraft
      summary: Получить черновик поездки для редактора
      responses:
        '200':
          description: Текущие поля Travel и привязки маршрутов дня
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /routes/{routeId}:
    parameters:
      - $ref: '#/components/parameters/RouteId'
    get:
      operationId: getRouteDraft
      summary: Получить текущую ревизию Geo для редактора
      responses:
        '200':
          description: Черновик маршрута либо безопасный результат с UUID ревизии для пересборки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /tracks/{trackId}/split:
    parameters:
      - name: trackId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      operationId: splitTrack
      summary: Разделить трек в ожидаемой ревизии Geo
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitCommand'
      responses:
        '200':
          description: Операция зафиксирована в Geo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SplitResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /trips/{tripId}/publish:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      operationId: publishTrip
      summary: Запустить явную публикацию набора точных ревизий
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishCommand'
      responses:
        '202':
          description: Операция записана, результат ожидается
          headers:
            Location:
              description: Относительный URL состояния этой операции
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationPending'
        '200':
          description: Результат существующей завершённой операции с тем же ключом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationTerminal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /trips/{tripId}/publication-operations/{operationId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - name: operationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      operationId: getPublicationOperation
      summary: Получить состояние операции публикации
      responses:
        '200':
          description: Состояние, видимое текущему уполномоченному инициатору
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationOperation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /trips/{tripId}/unpublish:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      operationId: unpublishTrip
      summary: Снять текущую публикацию и остановить конкурентные публикации
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnpublishCommand'
      responses:
        '200':
          description: Travel вернул пустой указатель после снятия, отмены подготовки или подтверждения уже пустого состояния
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnpublishResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /catalog/trips:
    get:
      operationId: listPublicTrips
      summary: Получить общий набор результатов для списка и карты
      security: []
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Публичные строки после актуальной серверной фильтрации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTripPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
  /catalog/trips/{tripId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      operationId: getPublicTrip
      summary: Получить актуальный опубликованный снимок с картой и днями
      security: []
      responses:
        '200':
          description: Один опубликованный снимок с проверенными Geo-данными
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTrip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /pois:
    get:
      operationId: listPois
      summary: Получить доступные POI в одном из трёх режимов
      security:
        - session: []
        - {}
      parameters:
        - name: scope
          in: query
          required: true
          description: trip требует trip_id и действующих полномочий. mine требует сессии. global всегда имеет гостевой контекст.
          schema:
            type: string
            enum: [global, mine, trip]
        - name: trip_id
          in: query
          description: Обязателен ровно для scope=trip. UUID поездки слоя, а не источник полномочий.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: q
          in: query
          description: Поиск по имени среди доступных POI в выбранном слое.
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: POI после ACL и модерации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoiPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /pois/{poiId}:
    parameters:
      - $ref: '#/components/parameters/PoiId'
    get:
      operationId: getPoi
      summary: Получить POI после проверки его действующей видимости
      security:
        - session: []
        - {}
      responses:
        '200':
          description: Разрешённые поля POI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poi'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /pois/{poiId}/visibility:
    parameters:
      - $ref: '#/components/parameters/PoiId'
    patch:
      operationId: changePoiVisibility
      summary: Изменить область видимости POI
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePoiVisibility'
      responses:
        '200':
          description: Новая ревизия и фактическое состояние после записи Geo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoiVisibilityResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /trips/{tripId}/pois/{poiId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/PoiId'
    put:
      operationId: attachExistingPoi
      summary: Привязать существующую POI к черновику поездки
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Geo подтвердил наличие разрешённой связи с тем же UUID POI
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /pois/{poiId}/media/{mediaId}:
    parameters:
      - $ref: '#/components/parameters/PoiId'
      - name: mediaId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      operationId: getPoiMedia
      summary: Получить изображение после проверки POI и самого медиа
      security:
        - session: []
        - {}
      responses:
        '200':
          description: Проверенные байты. GIS MVP отдаёт целый объект в пределах лимита загрузки.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: tropio_session
      description: HttpOnly, SameSite=Lax; в production также Secure.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Токен из csrf_token собственного профиля для изменения данных и сессии.
    registration:
      type: apiKey
      in: cookie
      name: tropio_registration
      description: HttpOnly cookie браузера, в котором началась регистрация.
  parameters:
    IdentityOrigin:
      name: Origin
      in: header
      required: true
      schema: {type: string, format: uri}
      description: Должен совпадать с настроенным origin приложения.
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RouteId:
      name: routeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PoiId:
      name: poiId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Новый UUID на новую команду. Повтор использует тот же ключ и те же входные параметры.
      schema:
        $ref: '#/components/schemas/Uuid'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    Bbox:
      name: bbox
      in: query
      style: form
      explode: false
      description: west,south,east,north в WGS 84. Пересечение антимеридиана в этом контракте не поддерживается.
      schema:
        type: array
        minItems: 4
        maxItems: 4
        items:
          type: number
    Cursor:
      name: cursor
      in: query
      description: Непрозрачный токен BFF для тех же фильтров и контекста доступа.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
  responses:
    IdentityInvalidRequest:
      description: Поля или формат запроса недопустимы.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 400}
                  code: {const: INVALID_REQUEST}
    IdentitySessionRequired:
      description: Требуется действующая сессия.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 401}
                  code: {const: SESSION_REQUIRED}
    IdentityInvalidCredentials:
      description: Вход отклонён. Проверьте учётные данные и подтверждение почты.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 401}
                  code: {const: INVALID_CREDENTIALS}
    IdentityCsrfRejected:
      description: Origin или токен защиты запроса отклонён.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 403}
                  code: {const: CSRF_REJECTED}
    IdentityNotFound:
      description: Профиль отсутствует или недоступен.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 404}
                  code: {const: NOT_FOUND}
    IdentityInvalidAuthToken:
      description: Ссылка недействительна или больше не может быть использована.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 422}
                  code: {const: INVALID_AUTH_TOKEN}
    IdentityAvatarUnavailable:
      description: Аватар недоступен для выбора.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 422}
                  code: {const: AVATAR_UNAVAILABLE}
    IdentityRateLimited:
      description: Слишком много попыток. Повторите запрос позже.
      headers:
        Retry-After:
          description: Время до повторной попытки в секундах.
          schema: {type: integer, minimum: 1}
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 429}
                  code: {const: RATE_LIMITED}
    IdentityUnavailable:
      description: Обязательная зависимость Identity недоступна.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: {const: 503}
                  code: {const: DEPENDENCY_UNAVAILABLE}
    BadRequest:
      description: Некорректный запрос, UUID, фильтр или обязательный заголовок
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Для операции нужна действующая сессия
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ForbiddenRequest:
      description: Запрос отклонён защитой CSRF
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Объект отсутствует или недоступен в этом контексте
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Изменилась ожидаемая ревизия или уже использован ключ команды
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Запрос формально корректен, но нарушает доменный инвариант
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Обязательный владелец состояния или прав временно недоступен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    IdentityProfile:
      type: object
      additionalProperties: false
      required: [id, display_name, bio, avatar, csrf_token]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        display_name: {type: string}
        bio: {type: [string, 'null']}
        avatar:
          anyOf:
            - $ref: '#/components/schemas/SystemAvatar'
            - type: 'null'
        csrf_token: {type: string, minLength: 1}
    PublicIdentityProfile:
      type: object
      additionalProperties: false
      required: [id, display_name, bio, avatar]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        display_name: {type: string}
        bio: {type: [string, 'null']}
        avatar:
          anyOf:
            - $ref: '#/components/schemas/SystemAvatar'
            - type: 'null'
    SystemAvatar:
      type: object
      additionalProperties: false
      required: [id, url]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        url: {type: string, format: uri-reference}
    SystemAvatarList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SystemAvatar'}
    RegisterIdentityRequest:
      type: object
      additionalProperties: false
      required: [email, password, accepted_terms]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
        accepted_terms: {const: true}
    LoginIdentityRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
    IdentityEmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 254}
    IdentityTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
    ResetIdentityPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
        password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
    UpdateIdentityProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: {type: string, minLength: 1, maxLength: 80}
        bio: {type: [string, 'null'], maxLength: 1000}
    SelectIdentityAvatarRequest:
      type: object
      additionalProperties: false
      required: [avatar_id]
      properties:
        avatar_id: {$ref: '#/components/schemas/Uuid'}
    Uuid:
      type: string
      format: uuid
    NullableUuid:
      anyOf:
        - $ref: '#/components/schemas/Uuid'
        - type: 'null'
    LonLat:
      type: object
      additionalProperties: false
      required: [lon, lat]
      properties:
        lon: {type: number, minimum: -180, maximum: 180}
        lat: {type: number, minimum: -90, maximum: 90}
    Position:
      type: array
      description: Пара WGS 84 в порядке longitude, latitude.
      prefixItems:
        - {type: number, minimum: -180, maximum: 180}
        - {type: number, minimum: -90, maximum: 90}
      minItems: 2
      items: false
    LineString:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: {type: string, const: LineString}
        coordinates:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Position'
    TripDraft:
      type: object
      additionalProperties: false
      required: [trip_id, trip_revision_id, publication_id, visibility, title, days]
      properties:
        trip_id: {$ref: '#/components/schemas/Uuid'}
        trip_revision_id: {$ref: '#/components/schemas/Uuid'}
        publication_id: {$ref: '#/components/schemas/NullableUuid'}
        visibility: {type: string, enum: [public, private]}
        title: {type: string}
        days:
          type: array
          items:
            $ref: '#/components/schemas/DraftDay'
    DraftDay:
      type: object
      additionalProperties: false
      required: [day_id, position, route_id]
      properties:
        day_id: {$ref: '#/components/schemas/Uuid'}
        position: {type: integer, minimum: 1}
        route_id: {$ref: '#/components/schemas/NullableUuid'}
    RouteDraft:
      oneOf:
        - $ref: '#/components/schemas/ReadableRouteDraft'
        - $ref: '#/components/schemas/RestrictedRouteDraft'
    ReadableRouteDraft:
      type: object
      additionalProperties: false
      required: [availability, route_id, route_revision_id, points, tracks]
      properties:
        availability: {type: string, const: available}
        route_id: {$ref: '#/components/schemas/Uuid'}
        route_revision_id: {$ref: '#/components/schemas/Uuid'}
        points:
          type: array
          items:
            $ref: '#/components/schemas/RoutePoint'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/Track'
    RestrictedRouteDraft:
      type: object
      additionalProperties: false
      required: [availability, route_id, route_revision_id]
      properties:
        availability: {type: string, const: geometry_restricted}
        route_id: {$ref: '#/components/schemas/Uuid'}
        route_revision_id: {$ref: '#/components/schemas/Uuid'}
    RoutePoint:
      type: object
      additionalProperties: false
      required: [point_id, position]
      properties:
        point_id: {$ref: '#/components/schemas/Uuid'}
        position: {$ref: '#/components/schemas/LonLat'}
        poi_id: {$ref: '#/components/schemas/Uuid'}
    Track:
      type: object
      additionalProperties: false
      required: [track_id, start_point_id, end_point_id, geometry, status]
      properties:
        track_id: {$ref: '#/components/schemas/Uuid'}
        start_point_id: {$ref: '#/components/schemas/Uuid'}
        end_point_id: {$ref: '#/components/schemas/Uuid'}
        geometry: {$ref: '#/components/schemas/LineString'}
        status: {type: string, enum: [ready, needs_rebuild]}
    SplitCommand:
      type: object
      additionalProperties: false
      required: [route_id, route_revision_id, split_position]
      properties:
        route_id: {$ref: '#/components/schemas/Uuid'}
        route_revision_id: {$ref: '#/components/schemas/Uuid'}
        split_position: {$ref: '#/components/schemas/LonLat'}
    SplitResult:
      type: object
      additionalProperties: false
      required: [route_id, route_revision_id, point_id, track_ids]
      properties:
        route_id: {$ref: '#/components/schemas/Uuid'}
        route_revision_id: {$ref: '#/components/schemas/Uuid'}
        point_id: {$ref: '#/components/schemas/Uuid'}
        track_ids:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
    PublishCommand:
      type: object
      additionalProperties: false
      required: [trip_revision_id, routes, poi_ids]
      properties:
        trip_revision_id: {$ref: '#/components/schemas/Uuid'}
        routes:
          type: array
          minItems: 1
          maxItems: 100
          description: Один элемент на день черновика в порядке дней. Принадлежность, полноту и уникальность проверяет Travel.
          items:
            $ref: '#/components/schemas/PublishRoute'
        poi_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          description: Явно выбранные глобальные POI для отдельного слоя. Пустой массив отключает слой.
          items:
            $ref: '#/components/schemas/Uuid'
    PublishRoute:
      type: object
      additionalProperties: false
      required: [day_id, route_id, route_revision_id]
      properties:
        day_id: {$ref: '#/components/schemas/Uuid'}
        route_id: {$ref: '#/components/schemas/Uuid'}
        route_revision_id: {$ref: '#/components/schemas/Uuid'}
    PublicationPending:
      type: object
      additionalProperties: false
      required: [operation_id, status]
      properties:
        operation_id: {$ref: '#/components/schemas/Uuid'}
        status: {type: string, const: pending}
    PublicationSucceeded:
      type: object
      additionalProperties: false
      required: [operation_id, status, publication_id, trip_revision_id]
      properties:
        operation_id: {$ref: '#/components/schemas/Uuid'}
        status: {type: string, const: succeeded}
        publication_id:
          $ref: '#/components/schemas/Uuid'
          description: ID снимка, записанного этой операцией. Актуальная публичная доступность проверяется отдельно.
        trip_revision_id:
          $ref: '#/components/schemas/Uuid'
          description: Ревизия поездки сразу после операции. Запрос черновика возвращает текущее значение.
    PublicationFailed:
      type: object
      additionalProperties: false
      required: [operation_id, status, code]
      properties:
        operation_id: {$ref: '#/components/schemas/Uuid'}
        status: {type: string, const: failed}
        code:
          type: string
          enum: [TRIP_REVISION_CONFLICT, ROUTE_REVISION_CONFLICT, ROUTE_NOT_READY, POI_PUBLICATION_RESTRICTED, PUBLICATION_PRECONDITION_FAILED, PUBLICATION_CANCELLED, PUBLICATION_TIMED_OUT]
    PublicationTerminal:
      oneOf:
        - $ref: '#/components/schemas/PublicationSucceeded'
        - $ref: '#/components/schemas/PublicationFailed'
    PublicationOperation:
      oneOf:
        - $ref: '#/components/schemas/PublicationPending'
        - $ref: '#/components/schemas/PublicationSucceeded'
        - $ref: '#/components/schemas/PublicationFailed'
    UnpublishCommand:
      type: object
      additionalProperties: false
      required: [trip_revision_id, publication_id]
      properties:
        trip_revision_id: {$ref: '#/components/schemas/Uuid'}
        publication_id:
          $ref: '#/components/schemas/NullableUuid'
          description: Текущий указатель. null позволяет остановить ещё не завершённую первую публикацию.
    UnpublishResult:
      type: object
      additionalProperties: false
      required: [publication_id, trip_revision_id]
      properties:
        publication_id: {type: 'null'}
        trip_revision_id: {$ref: '#/components/schemas/Uuid'}
    PublicTripSummary:
      type: object
      additionalProperties: false
      required: [trip_id, publication_id, title, start]
      properties:
        trip_id: {$ref: '#/components/schemas/Uuid'}
        publication_id: {$ref: '#/components/schemas/Uuid'}
        title: {type: string}
        start:
          $ref: '#/components/schemas/LonLat'
          description: Первая точка разрешённой закреплённой Geo-ревизии первого дня.
    PublicTrip:
      type: object
      additionalProperties: false
      required: [trip_id, publication_id, title, description, days, pois]
      properties:
        trip_id: {$ref: '#/components/schemas/Uuid'}
        publication_id: {$ref: '#/components/schemas/Uuid'}
        title: {type: string}
        description: {type: string}
        days:
          type: array
          items:
            $ref: '#/components/schemas/PublicDay'
        pois:
          type: array
          items:
            $ref: '#/components/schemas/PublicPoi'
    PublicDay:
      type: object
      additionalProperties: false
      required: [position, lines]
      properties:
        position: {type: integer, minimum: 1}
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LineString'
    PublicTripPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicTripSummary'
        next_cursor: {type: [string, 'null']}
    PublicPoi:
      type: object
      additionalProperties: false
      required: [poi_id, name, position]
      properties:
        poi_id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        position: {$ref: '#/components/schemas/LonLat'}
    Poi:
      type: object
      additionalProperties: false
      required: [poi_id, name, position, media]
      properties:
        poi_id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        description: {type: string}
        position: {$ref: '#/components/schemas/LonLat'}
        poi_revision_id:
          $ref: '#/components/schemas/Uuid'
          description: Присутствует только при праве изменять видимость в авторизованном контексте.
        media:
          type: array
          items:
            $ref: '#/components/schemas/PoiMedia'
    PoiMedia:
      type: object
      additionalProperties: false
      required: [media_id, href]
      properties:
        media_id: {$ref: '#/components/schemas/Uuid'}
        href:
          type: string
          format: uri-reference
          description: Относительная ссылка BFF, доступ проверяется заново при её открытии.
    PoiPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Poi'
        next_cursor: {type: [string, 'null']}
    ChangePoiVisibility:
      type: object
      additionalProperties: false
      required: [poi_revision_id, visibility]
      properties:
        poi_revision_id: {$ref: '#/components/schemas/Uuid'}
        visibility: {type: string, enum: [global, private, trip]}
        scope_trip_id: {$ref: '#/components/schemas/Uuid'}
      if:
        properties:
          visibility: {const: trip}
      then:
        required: [scope_trip_id]
      else:
        not:
          required: [scope_trip_id]
    PoiVisibilityResult:
      type: object
      additionalProperties: false
      required: [poi_id, poi_revision_id, visibility, moderation_status]
      properties:
        poi_id: {$ref: '#/components/schemas/Uuid'}
        poi_revision_id: {$ref: '#/components/schemas/Uuid'}
        visibility: {type: string, enum: [global, private, trip]}
        moderation_status: {type: string, enum: [pending, approved, rejected]}
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {type: string}
        request_id: {$ref: '#/components/schemas/Uuid'}
        current_trip_revision_id: {$ref: '#/components/schemas/Uuid'}
        current_route_revision_id: {$ref: '#/components/schemas/Uuid'}
        current_poi_revision_id: {$ref: '#/components/schemas/Uuid'}
