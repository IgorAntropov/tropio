name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      TROPIO_POSTGRES_PASSWORD: ci-local-postgres
      TROPIO_POSTGRES_PORT: '55432'
      TROPIO_REDIS_PASSWORD: ci-local-unused
      TROPIO_CLICKHOUSE_PASSWORD: ci-local-unused
      TROPIO_S3_ACCESS_KEY_ID: ci-local-unused
      TROPIO_S3_SECRET_ACCESS_KEY: ci-local-unused
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL
        run: docker compose up -d --wait --wait-timeout 180 postgres

      - name: Check workspace
        run: pnpm check

  pages:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
